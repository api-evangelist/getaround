    type: Documentation
    note: Owner API reference page; title present but documentation body now renders empty.
  - url: https://api.getaround.com/docs-interactive
    type: APIReference
    note: Interactive Swagger UI referenced by third parties; host no longer resolves (DNS failure) as of 2026-07-03.
  - url: https://getaround.com/blog/reaffirming-our-commitment-to-an-open-marketplace/
    type: Documentation
    note: Getaround's own blog post describing its open-API stance, the CarSync/Tenet partner ecosystem, and Getaround Connect hardware features.
  - url: https://www.kitts.io/integrations/getaround
    type: Documentation
    note: Third-party integration page describing the "Getaround charter" onboarding process (API key + webhook URL) and booking/calendar sync behavior.
  - url: https://apitracker.io/a/getaround
    type: Documentation
    note: Third-party API directory entry confirming OpenAPI/Swagger support and REST style, with most detail fields unpopulated.
  - url: https://github.com/Getaround/Blueforce
    type: SourceCode
    note: Public but apparently unmaintained iOS SDK for BLE-based Getaround Connect lock/unlock.
  - url: https://invers.com/en/press-releases/getaround-uses-invers-fleet-hawk-to-enhance-vehicle-security-for-fleet-owners/
    type: Documentation
    note: Describes Invers Fleet Hawk theft-detection integration with API-based incident-response access for fleet managers.
  - url: https://www.stocktitan.net/sec-filings/GETR/def-14a-getaround-inc-definitive-proxy-statement-7a9f374d3ae7.html
    type: Documentation
    note: Definitive proxy statement covering the planned corporate dissolution and liquidation of Getaround Inc.
  - url: https://techcrunch.com/2025/02/12/getaround-abruptly-shuts-down-us-car-sharing-operations/
    type: Documentation
    note: Reporting on the February 2025 abrupt shutdown of U.S. operations, including HyreCar.
  - url: https://fr.getaround.com/blog/getaround-and-gomore-a-new-chapter-for-carsharing-in-europe/
    type: Documentation
    note: Getaround's own announcement of the April 2026 sale of its European business to GoMore.
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket or other server-push protocol surface exists on any
    surviving Getaround API material, and the REST Owner API itself is no
    longer reachable (api.getaround.com fails to resolve). No AsyncAPI
    document was created. Because no live specification could be confirmed,
    apis.yml marks both listed APIs with endpointsModeled: true and no
    openapi/, collections/, plans/, rate-limits/, or finops/ artifacts were
    fabricated for this entry.
