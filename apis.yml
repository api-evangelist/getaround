apis:
- aid: getaround:getaround-owner-api
  name: Getaround Owner API
  tags:
  - Bookings
  - Vehicles
  - Fleet
  - Discontinued
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://getaround.com/docs/api/owner/v1
  properties:
  - url: https://getaround.com/docs/api/owner/v1
    type: Documentation
  - url: https://api.getaround.com/docs-interactive
    type: APIReference
  description: Historical partner/owner REST API used by fleet-management integrators (CarSync, FleetWire,
    Kitts) to sync bookings onto external calendars, block vehicle availability, generate invoices for
    professional owners, and receive event webhooks. Access required completing a "Getaround charter"
    with an account manager to receive an API key and register webhook URLs. Endpoints below are honestly
    modeled from partner integration write-ups (bookings, vehicles/availability, invoicing), not pulled
    from a live spec - api.getaround.com no longer resolves and the getaround.com/docs/api/owner/v1 reference
    page now renders empty, so this API should be treated as discontinued/unreachable rather than confirmed
    live.
  endpointsModeled: true
- aid: getaround:getaround-connect-blueforce-sdk
  name: Getaround Connect Blueforce SDK
  tags:
  - Connect
  - Telematics
  - Bluetooth LE
  - Discontinued
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://github.com/Getaround/Blueforce
  properties:
  - url: https://github.com/Getaround/Blueforce
    type: SourceCode
  description: Native iOS (Objective-C) SDK for the Getaround Connect smart-lock hardware fitted to shared
    vehicles - discovers nearby Connect devices over Bluetooth LE and issues lock/unlock commands via
    BlueforceConnectionManager. This is a Bluetooth device SDK, not an HTTP API; it is listed here because
    it is Getaround's only publicly documented Connect integration surface. The GitHub repository is public
    but appears unmaintained and there is no equivalent public REST or WebSocket surface for Connect telemetry.
  endpointsModeled: true
