name: Getaround
kind: company
description: Getaround was a peer-to-peer and connected car-sharing marketplace (merged with France's
  Drivy in 2019) that let owners list personal or fleet vehicles fitted with Getaround Connect - a BLE/telematics
  smart-lock kit - for keyless, app-based rental. Getaround historically ran a documented Owner API and
  webhook program for fleet-management partners (CarSync, FleetWire, Invers Fleet Hawk) plus a native
  Connect Blueforce BLE SDK for lock/unlock. OPERATING STATUS (as of 2026-07-03) - the company is winding
  down - it shut down U.S. operations (including its HyreCar subsidiary) in February 2025, sold its European
  car-sharing business to Denmark's GoMore ApS effective April 30, 2026, and Getaround Inc.'s board voted
  June 5, 2026 to pursue formal Delaware dissolution and liquidation (stockholder vote July 29, 2026,
  no distribution expected). The api.getaround.com API host no longer resolves and its owner API documentation
  page is now empty, so the API described here is historical/discontinued rather than currently operable.
